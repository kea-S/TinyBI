services:
  promptfoo-view:
    build:
      context: .
    image: tinybi-promptfoo:latest
    ports:
      - "15500:15500"
    volumes:
      - "./data:/app/data"
      - "./data/promptfoo_store:/root/.promptfoo"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["promptfoo", "view", "--port", "15500"]
    restart: unless-stopped

  promptfoo-eval:
    build:
      context: .
    image: tinybi-promptfoo:latest
    volumes:
      - "./src:/app/src"
      - "./data:/app/data"
      - "./data/promptfoo_store:/root/.promptfoo"
    env_file: .env
    environment:
      - PROMPTFOO_PYTHON=/usr/local/bin/python3
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://host.docker.internal:11434
      - TINYBI_USE_VLLM=${TINYBI_USE_VLLM:-false}
      - TINYBI_VLLM_URL=${TINYBI_VLLM_URL:-http://host.docker.internal:8003/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TINYBI_USE_VLLM=${TINYBI_USE_VLLM:-false}
      - TINYBI_VLLM_URL=${TINYBI_VLLM_URL:-http://host.docker.internal:8003/v1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
