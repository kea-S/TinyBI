services:
  promptfoo-view:
    build:
      context: .
    image: tinybi-promptfoo:latest
    ports:
      - "15500:15500"
    volumes:
      - "./data:/app/data"
      - "./data/promptfoo_store:/root/.promptfoo"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["promptfoo", "view", "--port", "15500"]
    restart: unless-stopped

  promptfoo-eval:
    build:
      context: .
    image: tinybi-promptfoo:latest
    volumes:
      - "./src:/app/src"
      - "./data:/app/data"
      - "./data/promptfoo_store:/root/.promptfoo"
    env_file: .env
    environment:
      - PROMPTFOO_PYTHON=/usr/local/bin/python3
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://host.docker.internal:11434
      - TINYBI_USE_VLLM=${TINYBI_USE_VLLM:-false}
      - TINYBI_VLLM_URL=${TINYBI_VLLM_URL:-http://host.docker.internal:8003/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build: 
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "4510:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TINYBI_USE_VLLM=${TINYBI_USE_VLLM:-false}
      - TINYBI_VLLM_URL=${TINYBI_VLLM_URL:-http://host.docker.internal:8003/v1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tinybi-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  tinybi-data:

